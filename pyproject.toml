[project]
name = "startrails"
version = "0.1.1"
description = "startrails"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "deferred-import>=0.1.0",
    "exif>=1.6.1",
    "imagecodecs>=2026.10.10",
    "jsonpickle>=4.1.3",
    "numpy>=2.5.4",
    "nvidia-ml-py>=13.615.71",
    "opencv-python-headless>=5.0.0",
    "openvino>=2026.4.1",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyside6>=6.12.0",
    "sahi>=0.12.8",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.19.0,<6",
    "tifffile>=2026.9.20",
    "ultralytics>=8.4.176",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
]
cu118 = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "cupy-cuda11x>=13.6.0",
]
cu124 = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "cupy-cuda12x>=14.2.0",
]
cu133 = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "cupy-cuda13x>=14.2.0",
]
mps = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu118" },
    { extra = "cu124" },
    { extra = "cu133" },
    { extra = "mps" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu130", extra = "cu133" },
  { index = "pytorch-cpu", extra = "mps" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu130", extra = "cu133" },
  { index = "pytorch-cpu", extra = "mps" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
