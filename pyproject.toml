[project]
name = "startrails"
version = "0.1.1"
description = "startrails"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "deferred-import>=0.1.0",
    "exif>=1.6.1",
    "jsonpickle>=4.1.3",
    "numpy>=2.5.4",
    "nvidia-ml-py>=13.615.71",
    "opencv-python-headless>=5.0.0",
    "openvino>=2026.4.1",
    "pi-heif>=1.4.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyside6-essentials>=6.12.0,<6.13",
    "sahi>=0.12.8",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.19.0,<6",
    "ultralytics>=8.4.176",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
]
cu11 = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "cupy-cuda11x>=13.6.0",
]
cu12 = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "cupy-cuda12x>=14.2.0",
]
cu13 = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "cupy-cuda13x>=14.2.0",
]
mps = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
]
rocm7 = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "triton-rocm>=3 ; sys_platform == 'linux'",
]
xpu = [
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "triton-xpu>=3 ; sys_platform == 'linux' or sys_platform == 'win32'",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu11" },
    { extra = "cu12" },
    { extra = "cu13" },
    { extra = "mps" },
    { extra = "rocm7" },
    { extra = "xpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu11" },
  { index = "pytorch-cu124", extra = "cu12" },
  { index = "pytorch-cu130", extra = "cu13" },
  { index = "pytorch-cpu", extra = "mps" },
  { index = "pytorch-rocm72", extra = "rocm7", marker = "sys_platform == 'linux'" },
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu11" },
  { index = "pytorch-cu124", extra = "cu12" },
  { index = "pytorch-cu130", extra = "cu13" },
  { index = "pytorch-cpu", extra = "mps" },
  { index = "pytorch-rocm72", extra = "rocm7", marker = "sys_platform == 'linux'" },
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
triton-rocm = [
  { index = "pytorch-rocm72", extra = "rocm7", marker = "sys_platform == 'linux'" },
]
triton-xpu = [
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "N801", # Class naming (PascalCase)
    "N802", # Function and method naming (snake_case)
]

[tool.ruff.lint.per-file-ignores]
# Legacy UI and operation classes use Qt-style camelCase naming
"src/startrails/ui/ui_*.py" = ["N801", "N802"]
"src/startrails/ui/resources_rc.py" = ["N801", "N802"]
"src/startrails/ui/__init__.py" = ["N801", "N802"]
"src/startrails/ui/canvasLabel.py" = ["N801", "N802"]
"src/startrails/ui/designer_plugins/register_startrails.py" = ["N801", "N802"]
"src/startrails/ui/file_manager.py" = ["N801", "N802"]
"src/startrails/ui/progress.py" = ["N801", "N802"]
"src/startrails/ui/progress_overlay.py" = ["N801", "N802"]
"src/startrails/ui/project.py" = ["N801", "N802"]
"src/startrails/ui/sidebar.py" = ["N801", "N802"]
"src/startrails/ui/signals.py" = ["N801", "N802"]
"src/startrails/ui/steps.py" = ["N801", "N802"]
"src/startrails/ui/theme.py" = ["N801", "N802"]
"src/startrails/ui/views/startrails.py" = ["N802"]
"src/startrails/app.py" = ["N802"]
"src/startrails/op/__init__.py" = ["N802"]
"src/startrails/op/detectStreaks.py" = ["N802"]
"src/startrails/op/exportMaskedImages.py" = ["N802"]
"src/startrails/op/exportStreaksTraining.py" = ["N802"]
"src/startrails/op/fillGaps.py" = ["N802"]
"src/startrails/op/stackImages.py" = ["N802"]
"src/startrails/workflow/startrails.py" = ["N802"]
"src/startrails/lib/gpu.py" = ["N802"]
"src/startrails/lib/util.py" = ["N802"]
"src/setup/*" = ["N802"]
"tests/*" = ["N802"]

# Existing training notebook predates the naming convention.
"training/Generate Cropped Dataset.ipynb" = ["N802"]
